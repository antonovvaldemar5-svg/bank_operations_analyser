[metadata]
name = financial-analysis
version = 0.1.0
description = Приложение для анализа банковских транзакций

[options]
packages = find:
python_requires = >=3.8
install_requires =
    pandas>=1.3.0
    openpyxl>=3.0.0
    requests>=2.26.0
    numpy>=1.21.0

[options.packages.find]
where = src
exclude =
    tests*
