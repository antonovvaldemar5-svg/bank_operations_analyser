[metadata]
name = financial-analysis
version = 0.1.0
description = Приложение для анализа банковских транзакций

[options]
packages = find:
python_requires = >=3.8
install_requires =
    pandas>=1.3.0
    openpyxl>=3.0.0
    requests>=2.26.0
    numpy>=1.21.0

[options.packages.find]
where = src
exclude =
    tests*

[options.extras_require]
dev =
    pytest>=6.0.0
    pytest-cov>=2.12.0
    black>=21.0.0
    isort>=5.9.0
    flake8>=3.9.0
    mypy>=0.910